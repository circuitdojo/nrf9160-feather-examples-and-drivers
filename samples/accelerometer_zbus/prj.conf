# General
CONFIG_CBPRINTF_FP_SUPPORT=y

# Log
CONFIG_LOG=y

# Adding I2C
CONFIG_I2C=y

# Add the accelerometer
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y
