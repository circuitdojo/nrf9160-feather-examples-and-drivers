sample:
  name: BME280 Sensor sample
tests:
  sample.sensor.bme280:
    sysbuild: true
    harness: console
    tags: sensors
    platform_allow:
      - circuitdojo_feather_nrf9151/nrf9151/ns
    integration_platforms:
      - circuitdojo_feather_nrf9151/nrf9151/ns
    harness_config:
      type: one_line
      regex:
        - "temp: (.*); press: (.*); humidity: (.*)"
      fixture: fixture_i2c_bme280
