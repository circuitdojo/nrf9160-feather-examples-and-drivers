name: Tests

on: []

jobs:
  tests:
    runs-on: ubuntu-latest
    container: zephyrprojectrtos/ci:v0.27.3
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      PIP_CACHE_DIR: /tmp/pip-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: nfed

      - name: Set variables
        working-directory: nfed
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT


      - name: Cache West dependencies
        id: cache-west
        uses: actions/cache@v4
        with:
          path: |
            nfed/zephyr
            nfed/modules
            nfed/tools
            nfed/bootloader
          key: west-${{ runner.os }}-v0.27.0-${{ hashFiles('nfed/west.yml') }}
          restore-keys: |
            west-${{ runner.os }}-v0.27.0-

      - name: Cache Python dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-v0.27.0-${{ hashFiles('nfed/zephyr/scripts/requirements-base.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-v0.27.0-

      - name: Initialize
        working-directory: nfed
        run: |
          pip3 install -U west
          west init -l .
          west update
          pip3 install -r ../zephyr/scripts/requirements-base.txt

      - name: Tests
        working-directory: nfed
        run: |
          ../zephyr/scripts/twister -W -T tests/

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: nfed_${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.sha_short }}
          path: |
            nfed/twister-out/testplan.json
            nfed/twister-out/twister_report.xml
            nfed/twister-out/twister_suite_report.xml
            nfed/twister-out/twister.json
            nfed/twister-out/testplan.json
            nfed/twister-out/**/*.log
