name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: zephyrprojectrtos/ci:v0.27.3
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      XDG_CACHE_HOME: /tmp/pip-cache
    strategy:
      fail-fast: false
      matrix:
        sample:
          [
            accelerometer,
            accelerometer_zbus,
            active_sleep,
            at_client,
            battery,
            blinky,
            bme280,
            button,
            deep_sleep,
            external_flash,
            external_rtc,
            external_rtc_time_sync,
            https,
            led_pwm,
            mfw_update,
            sms,
            serial_lte_modem,
            usb_detect
          ]
        target:
          [
            circuitdojo_feather_nrf9160/nrf9160/ns,
            circuitdojo_feather_nrf9151/nrf9151/ns,
          ]
        exclude:
          # List of target-app combinations to exclude
          - target: circuitdojo_feather_nrf9160/nrf9160/ns
            sample: deep_sleep
          - target: circuitdojo_feather_nrf9160/nrf9160/ns
            sample: usb_detect
          - target: circuitdojo_feather_nrf9151/nrf9151/ns
            sample: external_rtc
          - target: circuitdojo_feather_nrf9151/nrf9151/ns
            sample: external_rtc_time_sync
          - target: circuitdojo_feather_nrf9151/nrf9151/ns
            sample: led_pwm
          - target: circuitdojo_feather_nrf9151/nrf9151/ns
            sample: mfw_update
          - target: circuitdojo_feather_nrf9160/nrf9160/ns
            sample: serial_lte_modem
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: nfed

      - name: Set variables
        working-directory: nfed
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Cache West dependencies
        id: cache-west
        uses: actions/cache@v4
        with:
          path: |
            bootloader
            modules
            nrf
            nrfxlib
            tools
            zephyr
          key: west-${{ runner.os }}-v0.27.0-${{ hashFiles('nfed/west.yml') }}
          restore-keys: |
            west-${{ runner.os }}-v0.27.0-

      - name: Cache Python dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: /tmp/pip-cache
          key: pip-${{ runner.os }}-v0.27.0-${{ hashFiles('zephyr/scripts/requirements-base.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-v0.27.0-

      - name: Initialize
        working-directory: nfed
        run: |
          pip3 install -U west
          west init -l .
          west update
          pip3 install -r ../zephyr/scripts/requirements-base.txt

      - name: Extract target base name
        working-directory: nfed
        id: target_base
        run: |
          target_base=$(echo "${{ matrix.target }}" | cut -d'/' -f1)
          echo "target_base=$target_base" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.sample }} for ${{ matrix.target }}
        working-directory: nfed
        run: |
          west build -b ${{ matrix.target }} -s samples/${{ matrix.sample }} -p --sysbuild
          mkdir -p archive
          cp build/merged.hex archive/merged.hex
          cp build/dfu_application.zip archive/dfu_application.zip
          cp build/dfu_application.zip_manifest.json archive/dfu_application.zip_manifest.json
          ls -l archive

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nfed_${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.sha_short }}_${{ matrix.sample }}_${{ steps.target_base.outputs.target_base }}
          path: nfed/archive/
          if-no-files-found: warn
